name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check f1-core
        run: uv run mypy

      # Two invocations: LightGBM (Homebrew/OMP) and PyTorch (bundled OMP)
      # deadlock when both load into one process — see artifacts/phase2/FINDINGS.md.
      - name: Tests (core + pitwall)
        run: uv run pytest tests/f1_core tests/f1_pitwall --cov

      - name: Tests (vision)
        run: uv run pytest tests/f1_vision --cov --cov-append --cov-report=term-missing
