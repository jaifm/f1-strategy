[project]
name = "f1-core"
version = "0.1.0"
description = "Probabilistic F1 decision-support system: quantile LightGBM + conformal calibration + Monte Carlo race simulation."
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_core"]
