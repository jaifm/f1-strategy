[project]
name = "f1-pitwall"
version = "0.1.0"
description = "Integration layer: race replay orchestrator, model fusion, and Streamlit pit-wall dashboard."
requires-python = ">=3.11"
dependencies = [
    "f1-core",
    "f1-vision",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[project.scripts]
pitwall = "f1_pitwall.cli:main"

[tool.uv.sources]
f1-core = { workspace = true }
f1-vision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_pitwall"]
